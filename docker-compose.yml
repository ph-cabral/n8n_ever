volumes:
  postgres_data:
    driver: local
    name: postgres_data
  n8n_data:
    driver: local
    name: n8n_data
  qdrant_data:
    driver: local
    name: qdrant_data
  ollama_data:
    driver: local
    name: ollama_data
  frontend_node_modules:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: n8n_sql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ai-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: n8n_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-net
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: n8n_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama  # ← Modelos persistidos, no se re-descargan al reiniciar
    networks:
      - ai-net
    environment:
      - OLLAMA_NUM_PARALLEL=1       # Un request a la vez (ahorra RAM, emails son secuenciales)
      - OLLAMA_MAX_LOADED_MODELS=1  # Solo 1 modelo en memoria simultáneamente
      - OLLAMA_KEEP_ALIVE=5m        # Descarga el modelo de RAM si no hay actividad en 5 min
#    deploy:
 #     resources:
  #      limits:
   #       memory: 10G
    #    reservations:
     #     memory: 8G               # Garantiza RAM disponible al cargar el modelo
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s            # Le da tiempo de iniciar antes del primer check

  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    image: n8nio/n8n:latest
    container_name: n8n_ever
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODE_FUNCTION_ALLOW_EXTERNAL: mammoth

      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EMAIL_MODE: smtp

      N8N_BASIC_AUTH_ACTIVE: false
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: false
      N8N_SECURE_COOKIE: false
      N8N_ENDPOINT_WEBHOOK: webhook
      N8N_ENDPOINT_WEBHOOK_TEST: webhook-test
      N8N_SECURITY_ALLOWED_ORIGINS: "*"
      N8N_SECURITY_ALLOWED_METHODS: "GET, POST, OPTIONS"
      N8N_SECURITY_ALLOWED_HEADERS: "*"

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      MAMMOUTH_API_KEY: ${MAMMOUTH_API_KEY}

      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      TZ: ${TZ}

      N8N_PAYLOAD_SIZE_MAX: 100
      N8N_BINARY_DATA_TTL: 60
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all

      # ← URL de Ollama disponible como variable de entorno en n8n
      OLLAMA_BASE_URL: http://n8n_ollama:11434

    networks:
      - ai-net
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scrape.js:/home/node/scrape.js
#    deploy:
 #     resources:
  #      limits:
   #       memory: 12G
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: n8n_front
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL}
      VITE_N8N_WEBHOOK_URL_FILES: ${VITE_N8N_WEBHOOK_URL_FILES}
      NODE_ENV: development
      HOST: 0.0.0.0
#    deploy:
 #     resources:
  #      limits:
   #       memory: 3G
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - ai-net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
#    deploy:
 #     resources:
  #      limits:
   #       memory: 2G
    ports:
      - "80:80"
      - "443:443"
      - "3002:3002"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - ai-net
    depends_on:
      - frontend
      - n8n

networks:
  ai-net:
    external: true
