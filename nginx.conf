worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;

    # === UPSTREAMS ===
    upstream frontend {
        server frontend:5050;  # Nombre del servicio en docker-compose
    }

    upstream n8n_backend {
        server n8n:5678;       # Nombre del servicio (no container_name)
    }

    upstream mangueras_backend {  # Cambiado de mangueras-app a mangueras_backend para consistencia
        server mangueras_ever:3000;  # Container_name de mangueras
    }

    # === SERVER 1: FRONTEND + N8N (acceso por IP) ===
    server {
        listen 80;
        server_name 10.10.0.159;

        access_log /var/log/nginx/frontend_access.log;
        error_log /var/log/nginx/frontend_error.log;

        client_max_body_size 100M;

        # Frontend - CORREGIDO: era frontend_backend, ahora frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Webhooks de n8n
        location /webhook/ {
            limit_req zone=webhook_limit burst=20 nodelay;

            proxy_pass http://n8n_backend/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;

            add_header Access-Control-Allow-Origin "http://10.10.0.159:5050" always;
            add_header Access-Control-Allow-Origin "http://10.10.0.159" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Webhook test
        location /webhook-test/ {
            limit_req zone=webhook_limit burst=20 nodelay;

            proxy_pass http://n8n_backend/webhook-test/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;

            add_header Access-Control-Allow-Origin "http://10.10.0.159:5050" always;
            add_header Access-Control-Allow-Origin "http://10.10.0.159" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # n8n editor
        location /n8n/ {
            proxy_pass http://n8n_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_read_timeout 86400;
        }

        # Upload endpoint específico
        location /webhook-test/calidad {
            limit_req zone=webhook_limit burst=5 nodelay;

            proxy_request_buffering off;
            client_max_body_size 150M;

            proxy_pass http://n8n_backend/webhook-test/calidad;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # === SERVER 2: MANGUERAS (acceso por manguera.ever) ===
    server {
        listen 80;
        server_name manguera.ever;

        access_log /var/log/nginx/mangueras_access.log;
        error_log /var/log/nginx/mangueras_error.log;

        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # CORREGIDO: era mangueras_backend (que no existía), ahora coincide con upstream
        location / {
            proxy_pass http://mangueras_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            proxy_pass http://mangueras_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            client_max_body_size 50M;
        }
    }
}

